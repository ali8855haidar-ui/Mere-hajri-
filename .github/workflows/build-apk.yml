name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          RAW_VER="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "${RAW_VER}" ]; then
            echo "::error::Could not detect the active Java version."
            exit 1
          fi
          MAJOR_VER="${RAW_VER%%.*}"
          if [ "${MAJOR_VER}" = "1" ]; then
            MAJOR_VER="$(echo "${RAW_VER}" | cut -d. -f2)"
          fi
          if ! [[ "${MAJOR_VER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '${RAW_VER}'."
            exit 1
          fi
          echo "Detected Java major version: ${MAJOR_VER}"
          if [ "${MAJOR_VER}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VER} (${RAW_VER})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [ ! -x "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool was not found in JAVA_HOME (${JAVA_HOME})."
            exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            "${KEYTOOL_BIN}" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${APK_PATH}" ]; then
            echo "::error::Expected debug APK is missing at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi
          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: ${APK_PATH} ($(wc -c < "${APK_PATH}") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "${REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO}" ]; then
            SAFE_REPO="android-app"
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "${SOURCE_APK}" "${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release APK asset is invalid: ${ASSET_PATH}"
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_filename=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing or not a valid non-empty .apk file."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          {
            printf '%s\n\n' "This is an automatically generated debug APK built by GitHub Actions."
            printf '%s\n' "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}"
            printf '%s\n' "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            printf '%s\n' "- **Source Commit SHA:** ${GITHUB_SHA}"
            printf '%s\n\n' "- **APK Asset:** ${ASSET_FILENAME}"
            printf '%s\n' "- This APK is intended for testing."
            printf '%s\n' "- This APK is not a Play Store production release."
            printf '%s\n' "- This APK is signed only with a temporary debug keystore."
          } > "${NOTES_FILE}"

          if ! gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${NOTES_FILE}" \
            --latest; then
            echo "::warning::Failed to publish GitHub Release '${RELEASE_TAG}'. The debug APK build and Actions artifact 'app-debug-apk' remain available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ always() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            gh release view "${RELEASE_TAG}" >/dev/null
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url -q .url)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            {
              printf '### Debug APK Published to GitHub Releases\n\n'
              printf '%s\n' "- **Release Title:** ${RELEASE_TITLE}"
              printf '%s\n' "- **Release Tag:** \`${RELEASE_TAG}\`"
              printf '%s\n' "- **APK Asset:** \`${ASSET_FILENAME}\`"
              printf '%s\n\n' "- **Release Page:** ${RELEASE_URL}"
              printf '%s\n\n' "Download the APK directly from the **Assets** section on the GitHub Release page above."
              printf '%s\n' "The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              printf '### Debug APK Build Succeeded (GitHub Release Publishing Failed)\n\n'
              printf '%s\n\n' "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              printf '%s\n' "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              printf '%s\n' "- **Backup Download:** Download the \`app-debug-apk\` artifact from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
